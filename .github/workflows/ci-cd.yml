name: PausePulse CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci-cd:
    name: Build, Test & Docker Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Validate & Build Frontend UI
        run: |
          npm ci --legacy-peer-deps
          npm run build:ui

      - name: Validate & Build Backend API
        working-directory: ./server
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Verify Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend Docker Image
        run: |
          docker build -t pausepulse-backend:latest ./server

      - name: Build Frontend Docker Image
        run: |
          docker build -t pausepulse-frontend:latest .
