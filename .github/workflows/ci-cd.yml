name: PausePulse CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Code Validation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies & Build UI
        run: |
          npm ci --legacy-peer-deps
          npm run build:ui

      - name: Install Backend Dependencies & Compile TypeScript
        working-directory: ./server
        run: |
          npm ci
          npx prisma generate
          npm run build

  docker-build:
    name: Docker Containerization Build
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build --progress=plain -t pausepulse-backend:latest ./server

      - name: Build Frontend (Nginx) Docker Image
        run: |
          docker build --progress=plain -t pausepulse-frontend:latest .

      - name: Verify Docker Compose Configuration
        run: |
          docker compose config
